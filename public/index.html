<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Evo</title>
        <link rel="stylesheet" href="css/evo.css">
        <link rel="stylesheet" href="css/home.css">
    </head>
    <body>

        <div class="auth-container">
            <h1 class="auth-title">Evo</h1>
            <p class="auth-sub">Simplistic, Fast, Reliable</p>

            <div class="auth-buttons">
                <button class="btn-glass-border"><span>Sign In</span></button>
                <button class="btn-glass-border"><span>Sign Up</span></button>
            </div>

            <div class="divider"></div>

            <div class="continue-wrap">
                <button class="btn-glass-border continue-btn" onclick="window.location.href='pages/home.html'">Continue Without Signing In</button>
                <p class="continue-disclaimer">— By continuing you will have access to limited features</p>
            </div>

            <p class="footer-text">By continuing, you agree to our terms.</p>
        </div>

        <script src="js/main.js"></script>
    </body>
</html>
