<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Evo — Editor</title>
    <link rel="stylesheet" href="/css/evo.css">
    <link rel="stylesheet" href="/sections/editor/editor.css">
  </head>
  <body>
    <div style="width:100%; max-width:1200px; margin:24px;">
      <div class="glow-navbar" style="margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px">
          <button class="nav-btn" data-link="/">Evo</button>
          <button class="nav-btn" data-link="/home">Home</button>
        </div>
        <div style="display:flex; gap:12px; align-items:center">
          <a href="/profile" data-nav id="authLink" class="nav-btn">Profile</a>
        </div>
      </div>

      <main id="app-editor" style="min-height:560px;">
        <section class="editor-shell">
          <aside class="editor-files">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <h3>Files</h3>
              <div style="display:flex;gap:8px">
                <button class="btn-evo" id="btnToggleAI">AI</button>
                <button class="btn-evo" id="btnSettings">Settings</button>
              </div>
            </div>
            <div id="fileList" class="file-list"></div>
            <div class="file-actions"><button class="btn-evo" id="addFile">New File</button></div>
          </aside>

          <div class="editor-main">
            <div class="editor-toolbar">
              <input id="fileName" class="form-control evo" placeholder="Select a file or create new" />
              <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn-evo" id="saveFile">Save</button>
                <button class="btn-evo" id="runFile">Preview</button>
              </div>
            </div>

            <div class="editor-tabs" id="editorTabs" role="tablist"></div>

            <div id="editorContainer" class="editor-container">
              <div id="editorArea" class="monaco-fallback">
                <textarea id="editorFallback" class="editor-textarea" placeholder="Loading editor..."></textarea>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/sections/editor/editor.js"></script>
  </body>
</html>
<section>
  <div style="display:flex; gap:12px; height:100%;">
    <aside style="width:260px; background:rgba(0,0,0,0.06); padding:12px; border-radius:10px;">
      <h3>Files</h3>
      <div id="fileList" style="max-height:420px; overflow:auto;"></div>
      <div style="margin-top:12px;"><button class="btn-evo" id="addFile">Add File</button></div>
    </aside>

    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="fileName" class="form-control evo" style="flex:1;" placeholder="Select a file or create new" />
        <button class="btn-evo" id="saveFile">Save</button>
      </div>
      <div style="flex:1; background:#0b0b0b; border-radius:8px; padding:8px;">
        <textarea id="editorArea" style="width:100%; height:100%; border:none; background:transparent; color:#fff; font-family:monospace; font-size:13px; resize:none; outline:none;"></textarea>
      </div>
    </div>
  </div>

  <script>
    const projectsKey = 'evo_projects_v1';
    let project = null;
    function loadProject() {
      const active = localStorage.getItem('evo_active_project');
      const raw = localStorage.getItem(projectsKey) || '[]';
      let arr = [];
      try { arr = JSON.parse(raw); } catch(e){ arr = []; }
      project = arr.find(p=>p.id===active) || arr[0] || null;
      if (!project) {
        document.getElementById('fileList').innerHTML = '<div class="small-muted">No project loaded</div>';
        return;
      }
      renderFiles();
      openFile(project.files[0].path);
    }
    function renderFiles() {
      const fl = document.getElementById('fileList');
      fl.innerHTML = project.files.map(f=>`<div style="margin-bottom:6px"><button class="btn-evo file-open" data-path="${f.path}">${f.path}</button> <button class="btn-evo file-del" data-path="${f.path}">Del</button></div>`).join('');
      fl.querySelectorAll('.file-open').forEach(b=>b.onclick=()=>openFile(b.getAttribute('data-path')));
      fl.querySelectorAll('.file-del').forEach(b=>b.onclick=()=>{ const p=b.getAttribute('data-path'); project.files=project.files.filter(x=>x.path!==p); saveProjectToStorage(); renderFiles(); });
    }
    function openFile(path) {
      const f = project.files.find(x=>x.path===path);
      if (!f) return;
      document.getElementById('fileName').value = f.path;
      document.getElementById('editorArea').value = f.content || '';
    }
    function saveProjectToStorage() {
      const raw = localStorage.getItem(projectsKey) || '[]';
      let arr = [];
      try { arr = JSON.parse(raw); } catch(e){ arr = []; }
      const idx = arr.findIndex(p=>p.id===project.id);
      if (idx>=0) arr[idx]=project; else arr.unshift(project);
      localStorage.setItem(projectsKey, JSON.stringify(arr));
    }
    document.getElementById('addFile').onclick = () => {
      const name = prompt('File path (e.g. src/app.js):');
      if (!name) return;
      if (project.files.find(f=>f.path===name)) { alert('File exists'); return; }
      project.files.unshift({ path: name, content: '' });
      renderFiles(); openFile(name);
      saveProjectToStorage();
    };
    document.getElementById('saveFile').onclick = () => {
      const name = document.getElementById('fileName').value;
      const content = document.getElementById('editorArea').value;
      const f = project.files.find(x=>x.path===name);
      if (f) f.content = content; else project.files.unshift({ path: name, content });
      saveProjectToStorage();
      alert('Saved');
    };
    loadProject();
  </script>
</section>
