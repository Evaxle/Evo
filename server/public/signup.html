<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Evo — Sign Up</title>
    <link rel="stylesheet" href="/css/evo.css">
    <link rel="stylesheet" href="/css/evo-theme.css">
  </head>
  <body>
    <div class="center-wrap">
      <div class="card-evo">
        <h1>Create your Evo account</h1>
        <p class="lead small-muted">Sign up to save projects, sync across devices and connect GitHub repositories.</p>

        <form id="signup">
          <div class="mb-2">
            <input class="form-control evo" type="email" name="email" placeholder="Email" required />
          </div>
          <div class="mb-2">
            <input class="form-control evo" type="text" name="name" placeholder="Your name (optional)" />
          </div>
          <div class="mb-3">
            <input class="form-control evo" type="password" name="password" placeholder="Password" required />
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn-glass-border" type="submit"><span>Sign up</span></button>
            <div class="small-muted">Already have an account? <a href="/signin.html">Sign in</a></div>
          </div>
        </form>

        <div id="codeBox" style="display:none; margin-top:12px;">
          <p class="small-muted">Enter the verification code sent to your email.</p>
          <form id="verify">
            <div class="mb-2"><input class="form-control evo" name="code" placeholder="6-digit code" required /></div>
            <div><button class="btn-glass-border" type="submit"><span>Verify</span></button></div>
          </form>
        </div>

        <div id="msg" style="margin-top:12px; color:#ffd6ea"></div>
      </div>
    </div>

    <script src="/js/signup.js"></script>
  </body>
</html>
