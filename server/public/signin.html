<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Evo — Sign In</title>
    <link rel="stylesheet" href="/css/evo.css">
    <link rel="stylesheet" href="/css/evo-theme.css">
  </head>
  <body>
    <div class="center-wrap">
      <div class="card-evo">
        <h1>Sign in to Evo</h1>
        <p class="lead small-muted">Enter your credentials to continue — we'll send a verification code to your email.</p>

        <form id="signin">
          <div class="mb-2"><input class="form-control evo" type="email" name="email" placeholder="Email" required /></div>
          <div class="mb-3"><input class="form-control evo" type="password" name="password" placeholder="Password" required /></div>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn-glass-border" type="submit"><span>Sign in</span></button>
            <div class="small-muted">New? <a href="/signup.html">Create account</a></div>
          </div>
        </form>

        <div id="codeBox" style="display:none; margin-top:12px;">
          <p class="small-muted">Enter the verification code sent to your email.</p>
          <form id="verify">
            <div class="mb-2"><input class="form-control evo" name="code" placeholder="6-digit code" required /></div>
            <div><button class="btn-glass-border" type="submit"><span>Verify</span></button></div>
          </form>
        </div>

        <div id="msg" style="margin-top:12px; color:#ffd6ea"></div>
      </div>
    </div>

    <script src="/js/signin.js"></script>
  </body>
</html>
